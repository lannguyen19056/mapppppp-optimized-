name: Optimized Process OSM CSV Chunk

on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Chunk number to process (001–063). Set to "all" to run build_index then all parts sequentially, or specific part number.'
        required: true
        default: '001' # Changed to three digits

jobs:
  build_index:
    runs-on: ubuntu-latest
    outputs:
      index_cache_hit: ${{ steps.cache-osm-index.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(\'**/requirements.txt\') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          echo "osmium" > requirements.txt
          echo "shapely" >> requirements.txt
          echo "rtree" >> requirements.txt
          echo "psycopg2-binary" >> requirements.txt
          echo "geopy" >> requirements.txt
          pip install -r requirements.txt

      - name: Cache Vietnam OSM PBF
        id: cache-pbf
        uses: actions/cache@v4
        with:
          path: vietnam-latest.osm.pbf
          key: osm-pbf-${{ runner.os }}-v1-${{ hashFiles(\'vietnam-latest.osm.pbf\') }}
          restore-keys: |
            osm-pbf-${{ runner.os }}-v1-

      - name: Download PBF if missing
        if: steps.cache-pbf.outputs.cache-hit != \'true\'
        run: |
          echo "Downloading PBF file..."
          curl -SL -o vietnam-latest.osm.pbf https://download.geofabrik.de/asia/vietnam-latest.osm.pbf

      - name: Cache OSM Index and WayData
        id: cache-osm-index
        uses: actions/cache@v4
        with:
          path: |
            spatial_index.idx
            way_data_cache.pkl
          key: osm-index-cache-${{ runner.os }}-${{ hashFiles(\'vietnam-latest.osm.pbf\') }}

      - name: Build OSM Index (if not cached)
        # Use build_osm_index_v3.py as it's the latest optimized version
        if: steps.cache-osm-index.outputs.cache-hit != \'true\'
        run: |
          echo "Building OSM Index and Cache..."
          python build_osm_index_v3.py \
            --osm-pbf vietnam-latest.osm.pbf \
            --output-index spatial_index.idx \
            --output-cache way_data_cache.pkl
      - name: Verify index files created
        if: steps.cache-osm-index.outputs.cache-hit != \'true\'
        run: |
          ls -l spatial_index.idx way_data_cache.pkl
          echo "Index and cache files built."
      - name: Index files found in cache
        if: steps.cache-osm-index.outputs.cache-hit == \'true\'
        run: |
          echo "Index and cache files restored from cache."
          ls -l spatial_index.idx way_data_cache.pkl

  process_chunk:
    needs: build_index
    runs-on: ubuntu-latest
    # Use the service container for PostgreSQL as previously discussed
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runnerpassword # Use secrets for actual password
          POSTGRES_DB: gisdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    if: ${{ needs.build_index.result == \'success\' && (github.event.inputs.part != \'all\' || needs.build_index.outputs.index_cache_hit == \'true\' || needs.build_index.outputs.index_cache_hit != \'true\' ) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \'3.10\'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(\'**/requirements.txt\') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          if [ ! -f requirements.txt ]; then
            echo "osmium" > requirements.txt
            echo "shapely" >> requirements.txt
            echo "rtree" >> requirements.txt
            echo "psycopg2-binary" >> requirements.txt
            echo "geopy" >> requirements.txt
          fi
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OSM Index and WayData from cache
        uses: actions/cache@v4
        with:
          path: |
            spatial_index.idx
            way_data_cache.pkl
          key: osm-index-cache-${{ runner.os }}-${{ hashFiles(\'vietnam-latest.osm.pbf\') }}

      - name: Check if index files were restored
        run: |
          if [ -f spatial_index.idx ] && [ -f way_data_cache.pkl ]; then
            echo "Index and cache files successfully restored/found."
            ls -l spatial_index.idx way_data_cache.pkl
          else
            echo "Error: Index or cache files not found after attempting to restore from cache."
            exit 1
          fi

      - name: Process chunk ${{ github.event.inputs.part }}
        env:
          # Ensure DATABASE_URL uses the service container details
          DATABASE_URL: "postgresql://runner:runnerpassword@localhost:5432/gisdb" # Use secrets for password
        run: |
          CURRENT_PART=${{ github.event.inputs.part }}
          if [ "$CURRENT_PART" == "all" ]; then
            echo "\'all\' input detected, this job processes specific parts. Triggering for part 001."
            exit 0 
          fi
          # CURRENT_PART should already be correctly formatted (e.g., 001) from the input or trigger_next_chunk
          INPUT_CSV_BASENAME="vietnam_part_${CURRENT_PART}.csv"
          echo "Looking for CSV file: csv_chunks/$INPUT_CSV_BASENAME"
          # Use process_osm_optimized_v2.py as it has the cursor fix
          python process_osm_optimized_v2.py \
            --input-csv "csv_chunks/$INPUT_CSV_BASENAME" \
            --db-url "$DATABASE_URL" \
            --index-file spatial_index.idx \
            --cache-file way_data_cache.pkl

  trigger_next_chunk:
    needs: [build_index, process_chunk]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build_index.result == \'success\' && (needs.process_chunk.result == \'success\' || needs.process_chunk.result == \'skipped\') }}
    steps:
      - name: Trigger next chunk or complete
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const currentPart = "${{ github.event.inputs.part }}";
            let nextPartNumber;

            if (currentPart === "all") {
              console.log("Initial \'all\' detected, starting with part 001.");
              nextPartNumber = 1;
            } else {
              nextPartNumber = parseInt(currentPart) + 1;
            }

            // Assuming max part number is 63 for this example
            if (nextPartNumber <= 63) { 
              const nextPartStr = String(nextPartNumber).padStart(3, '0'); // Changed to 3 digits
              console.log(`Triggering next chunk: ${nextPartStr}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: context.workflow.id,
                ref: context.ref,
                inputs: { part: nextPartStr }
              });
            } else {
              console.log("All chunks processed.");
            }

