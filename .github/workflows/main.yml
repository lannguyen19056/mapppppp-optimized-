name: Optimized Process OSM CSV Chunk

on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Chunk number to process (001–063). Set to "all" to run build_index then all parts sequentially, or specific part number.'
        required: true
        default: '001'

jobs:
  build_index:
    runs-on: ubuntu-latest
    outputs:
      index_cache_hit: ${{ steps.cache-osm-index.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          echo "osmium" > requirements.txt
          echo "shapely" >> requirements.txt
          echo "rtree" >> requirements.txt
          echo "psycopg2-binary" >> requirements.txt
          echo "geopy" >> requirements.txt
          pip install -r requirements.txt

      - name: Cache Vietnam OSM PBF
        id: cache-pbf
        uses: actions/cache@v4
        with:
          path: vietnam-latest.osm.pbf
          key: osm-pbf-${{ runner.os }}-v1-${{ hashFiles('vietnam-latest.osm.pbf') }}
          restore-keys: |
            osm-pbf-${{ runner.os }}-v1-

      - name: Download PBF if missing
        if: steps.cache-pbf.outputs.cache-hit != 'true'
        run: |
          echo "Downloading PBF file..."
          curl -SL -o vietnam-latest.osm.pbf https://download.geofabrik.de/asia/vietnam-latest.osm.pbf

      - name: Cache OSM Index and WayData (with cache buster)
        id: cache-osm-index
        uses: actions/cache@v4
        with:
          path: |
            spatial_index.idx
            way_data_cache.pkl
          key: osm-index-cache-${{ runner.os }}-${{ hashFiles('vietnam-latest.osm.pbf') }}-force-rebuild-1 

      - name: Build OSM Index (if not cached)
        if: steps.cache-osm-index.outputs.cache-hit != 'true'
        run: |
          echo "Building OSM Index and Cache (cache miss forced or new PBF)..."
          python build_osm_index_v4.py \
            --osm-pbf vietnam-latest.osm.pbf \
            --output-index spatial_index.idx \
            --output-cache way_data_cache.pkl
      - name: Verify index files created
        if: steps.cache-osm-index.outputs.cache-hit != 'true'
        run: |
          ls -l spatial_index.idx way_data_cache.pkl
          echo "Index and cache files built."
      - name: Index files found in cache
        if: steps.cache-osm-index.outputs.cache-hit == 'true'
        run: |
          echo "Index and cache files restored from cache (this should not happen with cache buster if PBF is same)."
          ls -l spatial_index.idx way_data_cache.pkl

  process_chunk:
    needs: build_index
    runs-on: ubuntu-latest
    if: ${{ needs.build_index.result == 'success' && (github.event.inputs.part != 'all' || needs.build_index.outputs.index_cache_hit == 'true' || needs.build_index.outputs.index_cache_hit != 'true' ) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          if [ ! -f requirements.txt ]; then
            echo "osmium" > requirements.txt
            echo "shapely" >> requirements.txt
            echo "rtree" >> requirements.txt
            echo "psycopg2-binary" >> requirements.txt
            echo "geopy" >> requirements.txt
          fi
          pip install --upgrade pip
          pip install -r requirements.txt

      # Added steps to ensure PBF file is present before restoring index cache
      - name: Cache Vietnam OSM PBF (for process_chunk job)
        id: cache-pbf-process
        uses: actions/cache@v4
        with:
          path: vietnam-latest.osm.pbf
          key: osm-pbf-${{ runner.os }}-v1-${{ hashFiles('vietnam-latest.osm.pbf') }}
          restore-keys: |
            osm-pbf-${{ runner.os }}-v1-

      - name: Download PBF if missing (for process_chunk job)
        if: steps.cache-pbf-process.outputs.cache-hit != 'true'
        run: |
          echo "Downloading PBF file for process_chunk job..."
          # This should ideally not happen if build_index ran and downloaded/cached it
          # But as a fallback or if PBF cache key changes for some reason.
          curl -SL -o vietnam-latest.osm.pbf https://download.geofabrik.de/asia/vietnam-latest.osm.pbf
      
      - name: Verify PBF file exists for process_chunk
        run: |
          if [ ! -f vietnam-latest.osm.pbf ]; then
            echo "Critical Error: vietnam-latest.osm.pbf not found in process_chunk job. Cannot calculate correct cache key for index."
            exit 1
          fi
          echo "PBF file found in process_chunk job."

      - name: Restore OSM Index and WayData from cache (with cache buster)
        id: restore-osm-index
        uses: actions/cache@v4
        with:
          path: |
            spatial_index.idx
            way_data_cache.pkl
          key: osm-index-cache-${{ runner.os }}-${{ hashFiles('vietnam-latest.osm.pbf') }}-force-rebuild-1

      - name: Check if index files were restored
        run: |
          if [ -f spatial_index.idx ] && [ -f way_data_cache.pkl ]; then
            echo "Index and cache files successfully restored/found."
            ls -l spatial_index.idx way_data_cache.pkl
          else
            echo "Error: Index or cache files not found after attempting to restore from cache. Ensure build_index job ran and cached them correctly with the matching key."
            exit 1 # If index files are not here, processing cannot continue
          fi

      - name: Process chunk ${{ github.event.inputs.part }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          CURRENT_PART=${{ github.event.inputs.part }}
          if [ "$CURRENT_PART" == "all" ]; then
            echo "'all' input detected, this job processes specific parts. Triggering for part 001."
            exit 0 
          fi
          INPUT_CSV_BASENAME="vietnam_part_${CURRENT_PART}.csv"
          echo "Looking for CSV file: csv_chunks/$INPUT_CSV_BASENAME"
          python process_osm_optimized_v5.py \
            --input-csv "csv_chunks/$INPUT_CSV_BASENAME" \
            --db-url "$DATABASE_URL" \
            --index-file spatial_index.idx \
            --cache-file way_data_cache.pkl

  trigger_next_chunk:
    needs: [build_index, process_chunk]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build_index.result == 'success' && (needs.process_chunk.result == 'success' || needs.process_chunk.result == 'skipped') }}
    steps:
      - name: Trigger next chunk or complete
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const currentPart = "${{ github.event.inputs.part }}";
            let nextPartNumber;

            if (currentPart === "all") {
              console.log("Initial 'all' detected, starting with part 001.");
              nextPartNumber = 1;
            } else {
              nextPartNumber = parseInt(currentPart) + 1;
            }

            if (nextPartNumber <= 63) { 
              const nextPartStr = String(nextPartNumber).padStart(3, '0');
              console.log(`Triggering next chunk: ${nextPartStr}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: context.workflow,
                ref: context.ref,
                inputs: { part: nextPartStr }
              });
            } else {
              console.log("All chunks processed.");
            }

